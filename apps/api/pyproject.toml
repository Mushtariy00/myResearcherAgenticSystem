[project]
name = "agentic-api"
version = "0.1.0"
description = "FastAPI service for the Agentic Research Platform."
requires-python = ">=3.12,<3.13"
dependencies = [
    "agentic-core",
    "fastapi>=0.162,<0.163",
    "pydantic-settings>=2.10,<3",
    "uvicorn[standard]>=0.35,<1",
]

[tool.uv.sources]
agentic-core = { workspace = true }

[build-system]
requires = ["uv_build>=0.13,<0.14"]
build-backend = "uv_build"
