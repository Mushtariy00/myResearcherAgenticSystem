# Dev infrastructure for the Agentic Research Platform (Phase 0).
# Run through the Makefile (`make up`), which creates .data/ and exports ARP_UID/ARP_GID and the
# Docker socket proxy's settings.
# Every service has a memory limit: the dev box has 7.7 GiB for everything (see docs/PLAN.md).
# Ports bind to 127.0.0.1 only. Image tags are pinned; Renovate pins digests later (Phase 4).
name: arp

x-defaults: &defaults
  restart: unless-stopped
  logging:
    driver: local
    options:
      max-size: "10m"

services:
  postgres:
    <<: *defaults
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?copy .env.example to .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?copy .env.example to .env}
      POSTGRES_DB: ${POSTGRES_DB:-arp}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      # Postgres 18 images keep data under /var/lib/postgresql/<major>/docker.
      - pgdata:/var/lib/postgresql
    shm_size: 128m
    mem_limit: 512m
    oom_score_adj: -800  # keep the database alive if the box runs out of memory
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  valkey:
    <<: *defaults
    image: valkey/valkey:9.1.3-alpine
    # Rate-limit buckets must never be evicted, so memory is capped with noeviction.
    command: ["valkey-server", "--appendonly", "yes", "--maxmemory", "128mb", "--maxmemory-policy", "noeviction"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - valkeydata:/data
    mem_limit: 192m
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  temporal:
    <<: *defaults
    # Temporal CLI dev server (SQLite, includes the Web UI on :8233). Prod uses the server + Postgres.
    image: temporalio/temporal:1.9.1
    command: ["server", "start-dev", "--ip", "0.0.0.0", "--db-filename", "/data/temporal.db"]
    # The image runs as uid 1000; match the host user so it can write the bind-mounted state.
    user: "${ARP_UID:-1000}:${ARP_GID:-1000}"
    ports:
      - "127.0.0.1:7233:7233"  # gRPC (workers, API)
      - "127.0.0.1:8233:8233"  # Web UI
    volumes:
      - type: bind
        source: ../../.data/temporal
        target: /data
        bind:
          create_host_path: false
    mem_limit: 512m
    healthcheck:
      test: ["CMD", "temporal", "operator", "cluster", "health", "--address", "127.0.0.1:7233"]
      interval: 10s
      timeout: 5s
      retries: 12

  docker-proxy:
    <<: *defaults
    # The GPU executor's only way to Docker (docs/adr/0006-gpu-sandbox-hardened-docker.md): the
    # calls of apps/executor/src/agentic_executor/docker.py and nothing else. It serves them on a
    # Unix socket only the host user can open, not on a TCP port, which WSL would forward to
    # Windows for any process there, a browser too. The proxy anchors each rule to the whole path
    # (the query is not part of it) and answers 405 for a method, 403 for a path or a bind mount.
    # `make docker-proxy-check` shows what gets through.
    image: wollomatic/socket-proxy:1.13.1
    user: "${ARP_UID:-1000}:${ARP_DOCKER_GID:-989}"  # the docker group opens Docker's socket
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges]
    network_mode: none  # it listens on its socket only
    command:
      - -proxysocketendpoint=/run/docker-proxy/docker.sock
      - -proxysocketendpointfilemode=0600
      # Containers may bind-mount only the jobs folder and the NYU2 dataset, which the Makefile
      # lists. Without it, nothing: an empty list would let any folder through.
      - "-allowbindmountfrom=${ARP_DOCKER_BIND_ALLOWLIST:-/nonexistent}"
      # A single container only by a job container's name (agentic_executor.template
      # container_name). The executor addresses containers by name, so it can't reach any
      # other, nor read one's environment (Postgres's password, say).
      - '-allowGET=/v1\.[0-9]+/containers/(json|arp-job-[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}/(json|logs|archive))'
      - '-allowPOST=/v1\.[0-9]+/containers/(create|arp-job-[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}/(start|stop|kill|wait))'
      - '-allowDELETE=/v1\.[0-9]+/containers/arp-job-[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}'
      - -allowhealthcheck
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - type: bind
        source: ../../.data/docker-proxy  # created with mode 0700 by `make up`
        target: /run/docker-proxy
        bind:
          create_host_path: false
    mem_limit: 32m
    healthcheck:
      # The image's own probe: HEAD 127.0.0.1:55555/health inside the container (-allowhealthcheck).
      test: ["CMD", "/healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 3

  mailpit:
    <<: *defaults
    profiles: ["dev"]
    image: axllent/mailpit:v1.32.0
    ports:
      - "127.0.0.1:8025:8025"  # web inbox for invite / notification emails
      - "127.0.0.1:1025:1025"  # SMTP
    mem_limit: 64m

  grobid:
    <<: *defaults
    # PDF parsing for the literature stage: header, sections and references as TEI XML. The CRF
    # image has no deep-learning models and runs on CPU. Full-text parsing wants about 4 GiB, so
    # it is started on demand (`--profile parse`) and does not restart by itself.
    profiles: ["parse"]
    image: grobid/grobid:0.9.1-crf
    init: true
    restart: "no"
    ulimits:
      core: 0
    ports:
      - "127.0.0.1:8070:8070"
    mem_limit: 4g

  proxy:
    <<: *defaults
    profiles: ["dev"]
    image: caddy:2.11.7
    # Host networking so Caddy reaches the API and Next.js dev servers on 127.0.0.1 (WSL2 / Linux).
    network_mode: host
    volumes:
      - ./Caddyfile.dev:/etc/caddy/Caddyfile:ro
    mem_limit: 64m

volumes:
  pgdata:
  valkeydata:
