name: ci

on:
  push:
    branches: [v2]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Actions use version tags for now; Renovate pins them to commit SHAs (renovate.json).
# Installs are locked: CI fails if uv.lock or pnpm-lock.yaml is out of date.
jobs:
  python:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: arp
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: arp
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U arp -d arp"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      # Database tests create and migrate a throwaway `arp_test` database on this service.
      ARP_DATABASE_URL: postgresql+psycopg://arp:ci-only@127.0.0.1:5432/arp
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.6"
      - run: uv sync --all-packages --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pyright
      - run: uv run pytest

  web:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm --filter @agentic/web typecheck
      # Unit tests: en/ko message parity, error-code coverage, the inert-XSS check, the run flow.
      - run: pnpm --filter @agentic/web test
      - run: pnpm --filter @agentic/web build
