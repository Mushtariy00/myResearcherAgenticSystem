[project]
name = "agentic-db"
version = "0.1.0"
description = "PostgreSQL models, sessions and Alembic migrations for the Agentic Research Platform."
requires-python = ">=3.12,<3.13"
dependencies = [
    "agentic-core",
    "alembic>=1.20,<2",
    "psycopg[binary]>=3.2,<4",
    "sqlalchemy[asyncio]>=2.1,<2.2",
]

[tool.uv.sources]
agentic-core = { workspace = true }

[build-system]
requires = ["uv_build>=0.13,<0.14"]
build-backend = "uv_build"
