[project]
name = "agentic-scholarly"
version = "0.1.0"
description = "Literature-stage library: scholarly search clients, merge and rank, the open-access PDF waterfall, an SSRF-safe fetcher, PDF text, GROBID TEI parsing and evidence-quote checks."
requires-python = ">=3.12,<3.13"
# pydantic stays below 2.13 in the shared workspace (CrewAI's cap), so its floor is the workspace's.
# httpcore comes with httpx, but the fetcher's network backend imports it directly.
dependencies = [
    "defusedxml>=0.7.1,<1",
    "httpcore>=1.0.9,<2",
    "httpx>=0.28.1,<0.29",
    "pydantic>=2.11.9,<3",
    "pypdfium2>=5.14.0,<6",
    "redis>=7.4.1,<8",
]

[build-system]
requires = ["uv_build>=0.13,<0.14"]
build-backend = "uv_build"
