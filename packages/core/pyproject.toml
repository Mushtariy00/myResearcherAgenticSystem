[project]
name = "agentic-core"
version = "0.1.0"
description = "Shared domain types for the Agentic Research Platform (stages, strict stage-output schemas)."
requires-python = ">=3.12,<3.13"
# CrewAI 1.15 caps pydantic below 2.13 and the uv workspace shares one resolution.
dependencies = ["pydantic>=2.11.9,<3"]

[build-system]
requires = ["uv_build>=0.13,<0.14"]
build-backend = "uv_build"
