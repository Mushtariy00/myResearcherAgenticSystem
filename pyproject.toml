# uv workspace root (virtual: no package of its own).
# Members are listed explicitly because apps/web is a pnpm package, not a Python one.
[tool.uv.workspace]
members = [
    "apps/api",
    "apps/executor",
    "apps/gateway",
    "apps/worker",
    "packages/core",
    "packages/db",
    "packages/scholarly",
]

[tool.uv]
required-version = ">=0.13"

[dependency-groups]
dev = [
    "httpx>=0.28,<0.29",
    "pyright>=1.1.414",
    "pytest>=9.2,<10",
    "pytest-asyncio>=1.0,<2",
    "respx>=0.23.1,<0.24",
    "ruff>=0.17,<0.18",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["sandbox"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "S", "ASYNC", "RUF"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S101", "S105", "S106"]
# Dev checks run on this machine: they call docker and uv by name and assert their own steps.
"scripts/*.py" = ["S101", "S603", "S607"]
# Autogenerated by Alembic; reviewed, not hand-formatted.
"packages/db/migrations/versions/*" = ["E501", "W291"]

[tool.ruff.lint.isort]
known-first-party = [
    "agentic_*",
    "api_testkit",
    "executor_testkit",
    "gateway_testkit",
    "worker_testkit",
]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "standard"
include = [
    "apps/api",
    "apps/executor",
    "apps/gateway",
    "apps/worker",
    "packages/core",
    "packages/db",
    "packages/scholarly",
]
exclude = ["**/.venv", "**/node_modules", "sandbox"]
extraPaths = ["apps/api/tests", "apps/executor/tests", "apps/gateway/tests", "apps/worker/tests"]

[tool.pytest.ini_options]
testpaths = [
    "apps/api/tests",
    "apps/executor/tests",
    "apps/gateway/tests",
    "apps/worker/tests",
    "packages/core/tests",
    "packages/db/tests",
    "packages/scholarly/tests",
]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "--import-mode=importlib"
# Test helper modules (uniquely named) importable from test files.
pythonpath = ["apps/api/tests", "apps/executor/tests", "apps/gateway/tests", "apps/worker/tests"]
