[project]
name = "agentic_ai_system"
version = "0.1.0"
description = "agentic-ai-system using crewAI"
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.10,<3.14"
dependencies = [
    "crewai[tools]==1.14.4"
]

[project.scripts]
agentic_ai_system = "agentic_ai_system.main:run"
run_crew = "agentic_ai_system.main:run"
train = "agentic_ai_system.main:train"
replay = "agentic_ai_system.main:replay"
test = "agentic_ai_system.main:test"
run_with_trigger = "agentic_ai_system.main:run_with_trigger"
run_flow = "agentic_ai_system.main:run_flow"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.crewai]
type = "crew"
