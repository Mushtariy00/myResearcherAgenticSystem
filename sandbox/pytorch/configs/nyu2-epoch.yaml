# Phase 0 exit check: one full NYU2 epoch (50,688 train / 654 val samples) in the sandbox.
# Slow when the dataset is read from the Windows drive; copy it to the Linux disk first.
task: nyu2_depth
seed: 42
require_gpu: true
model:
  architecture: nyu2_simple
  kwargs:
    base_channels: 16
data:
  dataset: nyu2
  root: /data/nyu2
  split_file_template: "{root}/splits/nyu/{split}.txt"
  batch_size: 8
  num_workers: 2
training:
  loss: l1
  epochs: 1
  learning_rate: 0.001
  optimizer: adam
